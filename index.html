<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crime Prediction with Uncertainty in Birmingham</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { background: #0f172a; color: white; padding: 12px 20px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 4px 0 0; font-size: 0.85rem; color: #94a3b8; }
    #map { flex: 1; width: 100%; }
    .legend { background: white; padding: 10px 14px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); line-height: 1.5; font-size: 12px; }
    .legend i { width: 18px; height: 4px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Crime Prediction with Uncertainty in Birmingham</h1>
    <p>Click road segments to inspect mean crime predictions, 95% confidence intervals, and urban spatial attributes.</p>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([52.4800, -1.8900], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    function getColor(d) {
      return d > 5.0 ? '#dc2626' :
             d > 1.0 ? '#f59e0b' :
             d > 0.0 ? '#3b82f6' : '#10b981';
    }

    fetch('crime_roads.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          style: feature => ({
            color: getColor(feature.properties.pred_crime),
            weight: feature.properties.pred_crime > 1 ? 5 : 3,
            opacity: 0.85
          }),
          onEachFeature: (feature, layer) => {
            const p = feature.properties;
            layer.bindPopup(`
              <div style="font-size:13px; line-height:1.4;">
                <strong style="font-size:14px;">Road Segment #${p.road_id}</strong><hr style="margin:4px 0;">
                <b>Predicted Monthly Crime:</b> ${p.pred_crime} / mo<br>
                <b>95% CI (Uncertainty):</b> [${p.ci_lower}, ${p.ci_upper}] (±${p.ci_margin})<br>
                <b>Total Recorded Crime:</b> ${p.total_crime}<br>
                <br><b>Crime Breakdown:</b><br>
                • Violence/Sexual: ${p.violence}<br>
                • Anti-Social: ${p.anti_social}<br>
                • Theft: ${p.theft}<br>
                • Drugs: ${p.drugs}<br>
                <br><b>Urban Spatial Data:</b><br>
                • IMD Deprivation Decile: ${p.imd_deci}/10<br>
                • Crime Decile: ${p.cri_deci}/10<br>
                • Max Speed: ${p.maxspeed} mph<br>
                • Building Count: ${p.build_count}
              </div>
            `);
          }
        }).addTo(map);
        map.fitBounds(layer.getBounds());
      });

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `
        <strong>Predicted Monthly Crime</strong><br>
        <i style="background:#dc2626;"></i> High (&gt; 5.0)<br>
        <i style="background:#f59e0b;"></i> Moderate (1.0 - 5.0)<br>
        <i style="background:#3b82f6;"></i> Low (0.1 - 1.0)<br>
        <i style="background:#10b981;"></i> Minimal (0.0)
      `;
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
